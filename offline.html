<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo Offline - FF MAX Calibrador</title>
<meta name="theme-color" content="#10b981">
<style>
body {
  margin: 0;
  padding: 20px;
  background: linear-gradient(135deg, #0a0e18 0%, #141e2f 50%, #0f1824 100%);
  color: #f1f5fb;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.offline-container {
  background: #141e2f;
  border: 1px solid #253148;
  border-radius: 14px;
  padding: 40px 20px;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.4);
}

.offline-icon {
  font-size: 60px;
  margin-bottom: 20px;
}

h1 {
  font-size: 24px;
  margin: 0 0 10px 0;
  color: #fff;
}

p {
  color: #9ca3af;
  margin: 0 0 10px 0;
  line-height: 1.6;
  font-size: 14px;
}

.note {
  background: rgba(16, 185, 129, 0.1);
  border-left: 3px solid #10b981;
  padding: 12px;
  border-radius: 6px;
  margin-top: 20px;
  text-align: left;
  font-size: 12px;
  color: #38bdf8;
}

.button-group {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  flex: 1;
  padding: 12px 18px;
  border: 0;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

button.primary {
  background: #10b981;
  color: #022c22;
}

button.primary:hover {
  background: #059669;
  transform: translateY(-1px);
}

button.secondary {
  background: #1e293b;
  color: #f1f5fb;
  border: 1px solid #253148;
}

button.secondary:hover {
  background: #334155;
}
</style>
</head>
<body>

<div class="offline-container">
  <div class="offline-icon">📡</div>
  <h1>Sin Conexión</h1>
  <p>No hay conexión a internet disponible.</p>
  <p>Sin embargo, puedes seguir usando la aplicación con tus perfiles guardados anteriormente.</p>
  
  <div class="note">
    <strong>💡 Tip:</strong> Tu histórico de perfiles se sincronizará automáticamente cuando recuperes la conexión.
  </div>

  <div class="button-group">
    <button class="primary" onclick="goHome()">Ir a la App</button>
    <button class="secondary" onclick="retryConnection()">Reintentar</button>
  </div>
</div>

<script>
function goHome() {
  window.location.href = '/';
}

function retryConnection() {
  location.reload();
}

// Verificar conexión periódicamente
window.addEventListener('online', () => {
  console.log('[Offline] Conexión restaurada');
  location.reload();
});

// Reintento automático después de 5 segundos
setTimeout(() => {
  if (navigator.onLine) {
    location.reload();
  }
}, 5000);
</script>

</body>
</html>
